<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABBA-360</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-htmlmesh@2.7.0/build/aframe-html.min.js"></script>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div id="map-layer"></div>
    <div id="search-container"></div>

    <div id="drop-prompt">Enter a 360° panoramic view to start</div>

    <div id="hud">
        <div id="status"><span class="pulse"></span>HW: CONNECTING...</div>
        <div id="progress-container"></div>
    </div>

    <div id="radar-container"></div>

    <button id="xr-btn">ENTER VR</button>

    <div id="vr-engine"
        style="display: none; opacity: 0; position: absolute; width: 100%; height: 100%; z-index: 20; pointer-events: none; transition: opacity 1s;">
        <a-scene xr-mode-ui="enabled: false" contextual-thumbsticks>
            <a-entity id="vr-sky"></a-entity>
            <a-entity id="audio-treadmill"></a-entity>
            <a-entity id="ambient-pool"></a-entity>
            <a-entity id="camera-rig" position="0 0 0">

                <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
                    <a-entity id="vr-camera-hud" position="-0.3 0 -2" scale="3 3 3" visible="true">
                        <a-entity id="vr-hud-radar" position="0 0.25 0" class="raycastable"></a-entity>
                        <a-entity id="vr-hud-panel" position="0 -0.15 0" class="raycastable"></a-entity>
                    </a-entity>
                </a-entity>

                <a-entity id="leftHand" laser-controls="hand: left" oculus-touch-controls="hand: left"
                    raycaster="objects: .raycastable; far: 20">
                    <a-entity wrist-ui></a-entity>
                </a-entity>

                <a-entity id="rightHand" laser-controls="hand: right" oculus-touch-controls="hand: right"
                    raycaster="objects: .raycastable; far: 20">
                </a-entity>

            </a-entity>
        </a-scene>
    </div>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script type="module" src="./js/client.js"></script>
</body>

</html>
