<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>BRANI-360 | Environment Dashboard</title>
    <link rel="stylesheet" href="/admin/css/styles.css">
    <link rel="icon" href="data:,"> <!-- Mutes the favicon 404 error -->
</head>

<body>
    <div class="container">
        <div class="header">
            <h2>BRANI-360 .env Variables Editor</h2>
            <div class="controls">
                <button onclick="addNewSection()" style="background: #6a9955;">+ Add Section Header</button>
                <button onclick="openAddModal()">+ Add Variable</button>
                <button onclick="saveChanges()" style="background: #28a745;">Save & Sync Server</button>
            </div>
        </div>
        <div id="env-container"></div>
    </div>

    <!-- Custom Modal for Adding Variables -->
    <div id="add-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h3>Add New Variable</h3>
            <label>Placement (Target Section)</label>
            <select id="new-var-section"></select>

            <label>Key Name</label>
            <input type="text" id="new-var-key" placeholder="e.g., CLIENT_PARAM_NEW"
                style="width: 100%; box-sizing: border-box; margin-bottom: 15px;">

            <label>Initial Value</label>
            <textarea id="new-var-val" class="val-input auto-expand" placeholder="Value..."
                style="width: 100%; box-sizing: border-box; margin-bottom: 15px;" oninput="autoExpand(this)"></textarea>

            <label>Documentation (Comment)</label>
            <textarea id="new-var-comment" class="comment-input auto-expand"
                placeholder="# Describe what this variable does..." oninput="autoExpand(this)"></textarea>

            <label
                style="display: flex; align-items: center; gap: 8px; margin-bottom: 20px; cursor: pointer; color: #9cdcfe;">
                <input type="checkbox" id="new-var-locked" style="width: auto; margin: 0; transform: scale(1.2);">
                Lock Variable (Protect against accidental modification/deletion)
            </label>

            <div class="modal-actions">
                <button class="btn-danger" onclick="closeAddModal()">Cancel</button>
                <button onclick="confirmAddVariable()" style="background: #28a745;">Add Variable</button>
            </div>
        </div>
    </div>

    <!-- Custom Modal for Moving Variables -->
    <div id="move-modal" class="modal-overlay" style="display: none;">
        <div class="modal">
            <h3>Move Variable to Section</h3>
            <p style="color: #888; font-size: 0.9em; margin-top: 0;">Select the target section for <strong
                    id="move-var-name" style="color: #9cdcfe;"></strong>.</p>

            <label>New Placement</label>
            <select id="move-var-section"></select>

            <div class="modal-actions">
                <button class="btn-danger" onclick="closeMoveModal()">Cancel</button>
                <button onclick="confirmMoveVariable()" style="background: #007acc;">Move Variable</button>
            </div>
        </div>
    </div>

    <script src="/admin/js/admin.js"></script>
</body>

</html>
