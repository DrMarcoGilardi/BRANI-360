name: Auto-close PRs
on:
  pull_request_target:
    types: [opened, reopened]

jobs:
  close-pr:
    runs-on: ubuntu-latest
    # This line tells the bot to ONLY close PRs from outsiders
    if: github.event.pull_request.author_association != 'OWNER' && github.event.pull_request.author_association != 'COLLABORATOR'
    steps:
      - name: Close PR and leave comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr close "$PR_URL" --comment "Thank you for your interest! To maintain single-copyright ownership for our dual-licensing model, we do not accept external Pull Requests to the core BRANI-360 engine. 
          
          If you have a code proposal, bug fix, or custom strategy to share, please open a GitHub Issue instead. See our [Contributing Guidelines](https://github.com/uwscct/BRANI-360/blob/main/CONTRIBUTING.md) for more details."