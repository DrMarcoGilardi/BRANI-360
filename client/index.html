<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABBA-360</title>
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <link rel="stylesheet" href="./css/styles.css">
</head>

<body>
    <div id="map-layer"></div>
    <div id="search-container"></div>

    <div id="drop-prompt">Enter a 360° panoramic view to start</div>

    <div id="hud">
        <div id="status"><span class="pulse"></span>HW: CONNECTING...</div>
        <!-- node-info is dynamically injected by UIManager -->
        <div id="progress-container"></div>
    </div>

    <!-- Text is overridden by client.js, but good to have a generic fallback -->
    <button id="xr-btn">ENTER VR</button>

    <!-- a-scene for the XR module -->
    <div id="vr-engine"
        style="display: none; opacity: 0; position: absolute; width: 100%; height: 100%; z-index: 20; pointer-events: none; transition: opacity 1s;">
        <a-scene xr-mode-ui="enabled: false">
            <a-entity id="vr-sky"></a-entity>
            <a-entity id="audio-treadmill"></a-entity>
            <a-entity id="ambient-pool"></a-entity>

            <a-entity id="rig" position="0 0 0">
                <a-entity id="camera" camera position="0 1.6 0" look-controls="pointerLockEnabled: false">
                    <a-cursor raycaster="objects: .raycastable" color="#00f0ff"></a-cursor>
                </a-entity>

                <a-entity id="left-hand" hand-controls="hand: left" hand-tracking-controls="hand: left"
                    raycaster="objects: .raycastable">
                    <a-entity wrist-ui></a-entity>
                </a-entity>

                <a-entity id="right-hand" laser-controls="hand: right" hand-tracking-controls="hand: right"
                    raycaster="objects: .raycastable; far: 20">
                </a-entity>
            </a-entity>
        </a-scene>
    </div>

    <!-- Fallback if using localhost without zrok -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <!-- Load the dependency injection root -->
    <script type="module" src="./js/client.js"></script>
</body>

</html>
